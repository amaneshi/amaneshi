  .v { font: 600 12px 'Segoe UI', Ubuntu, sans-serif; fill: #1f2328; }
  .bg { fill: #ffffff; stroke: #d1d9e0; }
  .track { fill: #eff2f5; }
  .bar { fill: #00ADD8; }
  @media (prefers-color-scheme: dark) {
    .t, .v { fill: #f0f6fc; }
    .l { fill: #9198a1; }
    .bg { fill: #0d1117; stroke: #3d444d; }
    .track { fill: #151b23; }
